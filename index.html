<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B2D90">
<title>Smart Grade</title>
<style>
:root{
  --p:#5B2D90;--p2:#7E57C2;--pl:#EDE7F6;--bg:#F6F3FB;--card:#fff;--tx:#222;--mu:#6b6478;--bd:#E2DAEE;
  --g:#2E7D32;--gl:#DFF5E3;--r:#C62828;--rl:#FDE2E2;--y:#8D6E00;--yl:#FFF3C4;--o:#E65100;--ol:#FFE0B2;--b:#1565C0;--bl:#E3F2FD;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Leelawadee UI","Thonburi","Tahoma",sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--p);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1300px;margin:auto}
.brand{font-weight:800;font-size:20px;margin-right:auto}
.brand small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
.pick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pick label{font-size:13px;opacity:.85}
header select{background:#fff;color:var(--p);border:0;border-radius:8px;padding:6px 10px;font-weight:700;max-width:70vw}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1300px;margin:10px auto 0;scrollbar-width:none}
nav button{background:transparent;border:0;color:#fff;opacity:.75;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}
nav button.on{background:#fff;color:var(--p);opacity:1;font-weight:700}
main{max-width:1300px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:19px;color:var(--p)}
h3{margin:0 0 10px;font-size:16px;color:var(--p)}
.mu{color:var(--mu);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{border-radius:14px;padding:14px;text-align:center}
.kpi .l{font-size:13px;font-weight:700}
.kpi .v{font-size:30px;font-weight:800;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:10px;max-height:75vh}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:center;white-space:nowrap}
th{background:var(--pl);color:var(--p);position:sticky;top:0;font-weight:700;z-index:1}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:2;min-width:170px}
th.nm{background:var(--pl);z-index:3}
tr:hover td{background:#faf8fd}
table.sc th{white-space:normal;font-size:12px;line-height:1.25;min-width:64px;max-width:96px;vertical-align:bottom}
table.sc th.sum,table.sc td.sum{background:#F3EEFA}
table.sc th.tot,table.sc td.tot{background:#E6DCF5;font-weight:800}
table.sc th small{display:block;font-weight:800;font-size:12px;margin-top:2px}
input.sc{width:56px;text-align:center;border:1px solid var(--bd);border-radius:6px;padding:5px 2px;background:#FFFDF2}
input.sc.bad{border-color:var(--r);background:var(--rl)}
input.tx,select.tx{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;background:#FFFDF2}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}
.btn.s{background:var(--pl);color:var(--p)}
.btn.d{background:var(--rl);color:var(--r)}
.btn.sm{padding:5px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:14px}
.att{display:flex;gap:4px;justify-content:center}
.att button{width:38px;height:36px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:700;color:var(--mu)}
.att button.on.ม{background:var(--gl);color:var(--g);border-color:var(--g)}
.att button.on.ส{background:var(--ol);color:var(--o);border-color:var(--o)}
.att button.on.ล,.att button.on.ป{background:var(--bl);color:var(--b);border-color:var(--b)}
.att button.on.ข{background:var(--rl);color:var(--r);border-color:var(--r)}
.st{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;cursor:pointer;min-width:84px;font-weight:700;background:#fff}
.st.ok{background:var(--gl);color:var(--g)}.st.late{background:var(--yl);color:var(--y)}.st.no{background:var(--rl);color:var(--r)}
.bar{height:10px;background:var(--pl);border-radius:6px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--p2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
.empty{padding:28px;text-align:center;color:var(--mu)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:.95}
.warn{background:var(--yl);color:#5d4a00;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
textarea{width:100%;min-height:120px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:#FFFDF2}
.tick{width:40px;height:36px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;font-weight:800;font-size:18px;color:var(--g)}
.tick.on{background:var(--gl);border-color:var(--g)}
.modal{position:fixed;inset:0;background:rgba(30,15,50,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal p{margin:0 0 14px;font-size:16px;line-height:1.5}
.modal .row{justify-content:flex-end;margin:14px 0 0}
tr.foot th{position:static;background:#E6DCF5}
tr.foot th.nm{position:sticky;left:0;z-index:2}
.flagr{color:var(--r);font-weight:700}
.chip{display:inline-block;background:var(--pl);color:var(--p);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;margin-left:6px}
@media(max-width:560px){main{padding:10px}.card{padding:12px}td.nm,th.nm{min-width:120px}.att{gap:2px}.att button{width:31px;height:34px}th,td{padding:6px 5px}.kpi .v{font-size:24px}}
@media print{header,.noprint{display:none!important}main{padding:0}.card{border:0}.tw{max-height:none}}
.wsheet{background:#FBF9FE;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
.wsheet h3{margin:0 0 6px;font-size:18px}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:6px 0 10px}
.wmeta span{background:#fff;border:1px solid var(--bd);border-radius:999px;padding:2px 10px}
.wsheet ol{margin:6px 0 10px;padding-left:22px;line-height:1.6}
.wsheet table{max-width:520px}
.wsheet td{white-space:normal;text-align:left}
.wsheet td.pt{text-align:center;width:70px;font-weight:700}
details.wedit{margin-top:10px}
details.wedit summary{cursor:pointer;color:var(--p);font-weight:700}
details.wedit textarea{min-height:90px;background:#fff}
input.ws{width:58px}
.exwrap{display:grid;gap:14px}.exw{overflow-x:auto}.exsvg{width:100%;height:auto;display:block;margin:auto}
.mmb{background:#fff;border:3px solid;border-radius:14px;padding:6px 10px;font-size:14px;line-height:1.35;height:100%;box-sizing:border-box;overflow:hidden;font-family:inherit}
.mmb b{display:block;font-size:17px;margin-bottom:2px}
.mmc{color:#fff;font-weight:800;font-size:19px;text-align:center;display:flex;align-items:center;justify-content:center;height:100%;line-height:1.25;padding:0 8px;font-family:inherit}
.excomic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cp{border:3px solid #222;border-radius:10px;padding:10px;background:#FFFDF5;position:relative;display:flex;flex-direction:column;gap:8px;min-height:210px}
.cp .art{font-size:54px;text-align:center;line-height:1.15}.cn{position:absolute;top:4px;left:9px;font-weight:800}
.cp .say{background:#fff;border:2px solid #222;border-radius:16px;padding:6px 12px;font-weight:700;align-self:center;text-align:center}
.cp .cap{background:#FFF59D;border:2px solid #222;padding:6px 8px;font-size:14px;margin-top:auto}
.exbook{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pg{border:1.5px solid #bbb;border-radius:6px;padding:8px;background:#fff;aspect-ratio:3/4;font-size:13px;line-height:1.4;position:relative;box-shadow:2px 2px 0 #ddd;overflow:hidden}
.pg .art{font-size:30px;text-align:center}.pg b{display:block;color:#5B2D90;margin:2px 0 4px;font-size:14px}.pg.cover{background:#EDE7F6;text-align:center}
.pn{position:absolute;bottom:4px;right:8px;font-size:11px;color:#888}
.exinfo{border:3px solid var(--ic);border-radius:14px;overflow:hidden;background:#fff}
.ih{background:var(--ic);color:#fff;font-size:20px;font-weight:800;padding:10px 14px}.ih small{display:block;font-size:13px;font-weight:400;opacity:.9}
.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;padding:12px}
.is{background:#F7F9FC;border-radius:10px;padding:10px}.is .ii{font-size:30px}.is ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.if{border-top:1px dashed #ccc;padding:8px 14px;font-size:13px;color:#555}
.excards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.ec{border:2px solid var(--bd);border-radius:12px;padding:10px;background:#fff;font-size:14px;line-height:1.5}.ec .art{font-size:34px;text-align:center}.ec b{display:block;color:var(--p);margin:4px 0}
.extbl{background:#fff}.extbl td,.extbl th{white-space:normal;text-align:left;border:1px solid var(--bd);position:static}
.exh{font-weight:700;margin-bottom:6px;color:var(--p)}
.excalc{background:#FFFDE7;border-left:5px solid #F9A825;padding:8px 12px;border-radius:6px;font-size:15px;line-height:1.6}
.extip{background:#E8F5E9;border-radius:10px;padding:8px 12px;font-size:14px}.extip ul{margin:4px 0 0;padding-left:20px}
.exnote{font-size:13px;color:var(--mu);margin:0}
.exposter{border:3px solid #5B2D90;border-radius:12px;padding:10px;background:#fff;max-width:640px;margin:auto}
.exposter .pt{background:#5B2D90;color:#fff;text-align:center;font-weight:800;font-size:17px;padding:8px;border-radius:8px}
.pgd{display:grid;grid-template-areas:"a d d" "b d d" "c e f";grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.pb{border:2px dashed #9575CD;border-radius:8px;padding:8px;font-size:13px;min-height:70px;background:#F8F5FD}.pb b{display:block;color:#5B2D90}.pb.big{background:#EDE7F6}
.pfoot{text-align:center;font-size:12px;color:#666}
.exbox{border:2px solid #FFB74D;background:#FFF8E1;border-radius:12px;padding:12px 14px;margin:12px 0}
.exbox>h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.exfull{position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:16px}
.exfull .in{max-width:1200px;margin:auto;font-size:18px}.exfull .ec,.exfull .is ul,.exfull .cp .cap,.exfull .extip,.exfull .pg{font-size:17px}
@media(max-width:700px){.exbook{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.excomic{grid-template-columns:1fr}}
body.pw{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea .exsvg{min-width:0!important}#printArea .exw{overflow:visible}#printArea .exbox{break-inside:auto}#printArea .exbook,#printArea .excomic,#printArea .exinfo,#printArea svg{break-inside:avoid}
#printArea{display:none}
body.pw header,body.pw main,body.pw .toast{display:none!important}
body.pw #printArea{display:block;padding:0 6mm;font-size:15px;color:#000}
#printArea .pw1{break-inside:avoid;border:1.5px solid #888;border-radius:10px;padding:10px 14px;margin:0 0 10px}
#printArea h1{font-size:20px;margin:0 0 4px}#printArea h2{font-size:17px;margin:0 0 4px;color:#000}
#printArea ol{margin:4px 0;padding-left:22px}#printArea table{width:auto;font-size:14px}#printArea td,#printArea th{border:1px solid #999;padding:3px 8px;white-space:normal;text-align:left;position:static;background:#fff}
</style>
</head>

function planKey(c) {
  const r = R(c)?.name || "", s = c.subject || "";
  if (s.includes("PBL") || s.includes("โครงงาน")) return "pbl";
  if (s.startsWith("วิทยาศาสตร์")) return "sci2";
  if (s.startsWith("โลก")) return "earth4";
  if (s.startsWith("เคมี")) return { "ม.4": "chem4", "ม.5": "chem5", "ม.6": "chem6" }[r.slice(0, 3)];
  return null;
}
// ถ้าช่องที่จะผูกกับงานมีคะแนนที่กรอกไว้แล้ว ย้ายคะแนนนั้นมาเป็นคะแนนงาน (ไม่ให้คะแนนเดิมหาย)
function adoptScores(c, w) {
  if (!w.col || c.works.some(x => x !== w && x.col === w.col)) return;
  const col = colById(c, w.col); if (!col) return;
  for (const sid in c.scores) { const v = c.scores[sid][w.col]; if (v === "" || v == null) continue;
    ((c.wsc ||= {})[w.id] ||= {})[sid] = Math.round(v / (+col.max || 1) * (+w.max) * 100) / 100;
    const sub = c.sub[w.id] ||= {}; if (!sub[sid]) sub[sid] = "ok"; }
}
function applyPlan(c) {
  const list = WPLAN[planKey(c)]; if (!list) return 0;
  let n = 0;
  for (const p of list) {
    if (c.works.some(w => w.name === p.n)) continue;
    const col = c.cols.find(x => x.id === p.col && x.kind === "in");
    const tot = p.r.reduce((a, x) => a + x[1], 0);
    c.works.push({ id: uid(), name: p.n, col: col && !nbLinked(c, col) ? col.id : null, max: col ? +col.max : tot,
      topic: p.t, fmt: p.f, who: p.w, when: p.d, how: [...p.h], rub: p.r.map(x => [...x]), plan: 1, ex: p.n });
    adoptScores(c, c.works[c.works.length - 1]);
    n++;
  }
  return n;
}
function migrate() {
  for (const c of S.courses) {
    c.works ||= []; c.sub ||= {}; c.wsc ||= {}; c.scores ||= {};
    if (!c.planV) { applyPlan(c); c.planV = 1; }
    for (const w of c.works) if (w.plan && !w.ex && EXW[w.name]) w.ex = w.name;
  }
}

// ---------- กราฟ ----------
function donut(data) {
  const tot = data.reduce((a, d) => a + d.v, 0);
  if (!tot) return `<div class="empty">ยังไม่มีคะแนน</div>`;
  let a0 = -Math.PI / 2, s = "";
  const RR = 80, r = 50, cx = 100, cy = 100, p = (rad, a) => `${cx + rad * Math.cos(a)},${cy + rad * Math.sin(a)}`;
  for (const d of data) {
    if (!d.v) continue;
    if (d.v === tot) { s += `<circle cx="${cx}" cy="${cy}" r="${(RR + r) / 2}" fill="none" stroke="${d.c}" stroke-width="${RR - r}"/>`; break; }
    const a1 = a0 + d.v / tot * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
    s += `<path d="M${p(RR, a0)} A${RR},${RR} 0 ${big} 1 ${p(RR, a1)} L${p(r, a1)} A${r},${r} 0 ${big} 0 ${p(r, a0)}Z" fill="${d.c}"><title>${d.k}: ${d.v} คน</title></path>`;
    a0 = a1;
  }
  return `<svg viewBox="0 0 200 200" style="max-width:220px;display:block;margin:auto">${s}
    <text x="100" y="98" text-anchor="middle" font-size="26" font-weight="800" fill="#5B2D90">${tot}</text>
    <text x="100" y="118" text-anchor="middle" font-size="12" fill="#6b6478">คน</text></svg>
    <div class="legend">${data.filter(d => d.v).map(d => `<span><b style="background:${d.c}"></b>เกรด ${d.k}: ${d.v} (${Math.round(d.v / tot * 100)}%)</span>`).join("")}</div>`;
}
function bars(items) {
  if (!items.some(i => i.v != null)) return `<div class="empty">ยังไม่มีคะแนน</div>`;
  const W = 48, gap = 12, H = 160, w = items.length * (W + gap) + 30;
  let s = "";
  for (const t of [0, 25, 50, 75, 100]) { const y = 10 + H - t / 100 * H; s += `<line x1="28" x2="${w}" y1="${y}" y2="${y}" stroke="#eee"/><text x="22" y="${y + 4}" font-size="10" text-anchor="end" fill="#999">${t}</text>`; }
  items.forEach((it, i) => {
    const x = 34 + i * (W + gap), h = (it.v || 0) / 100 * H;
    s += `<rect x="${x}" y="${10 + H - h}" width="${W}" height="${h}" rx="5" fill="#5B2D90"><title>${esc(it.k)}: ${fmt(it.v)}%</title></rect>
      <text x="${x + W / 2}" y="${6 + H - h}" font-size="11" text-anchor="middle" fill="#5B2D90" font-weight="700">${it.v == null ? "" : fmt(it.v, 0)}</text>
      <text x="${x + W / 2}" y="${H + 26}" font-size="10" text-anchor="middle" fill="#555">${esc(it.k.length > 10 ? it.k.slice(0, 10) + "…" : it.k)}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${H + 36}" style="min-width:${Math.min(w, 640)}px;width:100%;max-height:240px">${s}</svg></div>`;
}

    ${k("ส่งงานเฉลี่ย", avg(rows.map(r => r.w.pct)) == null ? "-" : fmt(avg(rows.map(r => r.w.pct)), 0) + "%", "var(--ol)", "var(--o)")}
  </div>
  <div class="grid2">

    ${watch.length ? `<div class="tw"><table><tr><th class="nm">ชื่อ</th><th>% เวลาเรียน</th><th>งานค้าง</th><th>สมุด</th><th>เกรด</th></tr>

function backupWarn() {
  const lb = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 864e5) : null;
  if (!storageOK) return `<div class="warn">⚠ เบราว์เซอร์นี้บันทึกข้อมูลไม่ได้ (อาจเปิดแบบไม่ระบุตัวตน) กรุณาสำรองข้อมูลเป็นไฟล์ที่แท็บตั้งค่า</div>`;
  if (lb == null || lb >= 7) return `<div class="warn noprint">💾 ข้อมูลเก็บไว้ในเบราว์เซอร์เครื่องนี้ ${lb == null ? "ยังไม่เคยสำรองข้อมูล" : "สำรองครั้งล่าสุด " + lb + " วันก่อน"} — <a href="#" data-act="backup">สำรองข้อมูลตอนนี้</a></div>`;
  return "";
}

function parseLine(l) {
  let t = l.trim().replace(/^\d+[\s.)]+/, ""); if (!t) return null;
  const cols = t.split("\t").map(x => x.trim()).filter(Boolean);
  let prefix = "", first = "", last = "";
  const pre = s => { const m = s.match(/^(ด\.ช\.|ด\.ญ\.|น\.ส\.|เด็กชาย|เด็กหญิง|นางสาว|นาย|นาง)\s*/); if (!m) return ["", s];
    const map = { "เด็กชาย": "ด.ช.", "เด็กหญิง": "ด.ญ.", "นางสาว": "น.ส." }; return [map[m[1]] || m[1], s.slice(m[0].length)]; };
  if (cols.length >= 3 && /^(ด\.|น\.|นา|เด็ก)/.test(cols[0]) && cols[0].length <= 8) [prefix, first, last] = [pre(cols[0])[0] || cols[0], cols[1], cols[2]];
  else if (cols.length >= 2) { [prefix, first] = pre(cols[0]); last = cols.slice(1).join(" "); }
  else { [prefix, t] = pre(t); const p = t.split(/\s+/); first = p.shift() || ""; last = p.join(" "); }
  return { prefix, first, last };
}

function updateScoreRow(c, tr) {
  const sid = tr.dataset.sid;
  for (const x of c.cols) if (x.kind !== "in" || nbLinked(c, x) || wLinked(c, x)) { const td = tr.querySelector(`[data-o="${x.id}"]`); if (td) td.textContent = cellOut(c, sid, x); }

function download(name, text, type) {
  const b = new Blob([text], { type }), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(name, rows) {
  const t = "﻿" + rows.map(r => r.map(v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(",")).join("\r\n");
  download(name, t, "text/csv;charset=utf-8");
}
const fn = (c, k) => `${k}_${c.subject}_${R(c).name}_${today()}.csv`.replace(/[\\/:*?"<>|]/g, "-");

// ---------- events ----------
main.addEventListener("click", e => {

  const act = {
    addStu() { const no = Math.max(0, ...room.students.map(s => +s.no || 0)) + 1; room.students.push({ id: uid(), no, prefix: "", first: "", last: "" }); },
    async delStu() { const s = room.students.find(x => x.id === sid); if (!await ask(`ลบ ${fullName(s) || "นักเรียนคนนี้"} ออกจากห้อง ${room.name} และข้อมูลทุกวิชาของเขา?`)) return false;
      room.students = room.students.filter(x => x.id !== sid); roomCourses(room.id).forEach(x => delete x.scores[sid]); },
    bulkAdd() { const ls = document.getElementById("bulk").value.split(/\n/).map(parseLine).filter(Boolean); let no = Math.max(0, ...room.students.map(s => +s.no || 0));

    allPresent() { const day = c.att[S.attDate] ||= {}; room.students.forEach(s => { if (!day[s.id]) day[s.id] = "ม"; }); toast("บันทึกทุกคนมา (คนที่บันทึกไว้แล้วไม่เปลี่ยน)"); },

    async addWork() { const n = await askText("ชื่องาน", `งานที่ ${c.works.length + 1}`); if (!n) return false; const w = { id: uid(), name: n.trim(), col: null, max: 10, topic: "", fmt: "", who: "", when: "", how: [], rub: [] }; c.works.push(w); S.workSel = w.id; toast("เพิ่มงานแล้ว — กด ✏️ แก้ไขรายละเอียดงาน เพื่อเลือกช่องคะแนน"); },
    async renWork() { const w = c.works.find(x => x.id === S.workSel); const n = await askText("ชื่องานใหม่", w.name); if (!n) return false; w.name = n.trim(); },
    async delWork() { if (!await ask("ลบงานนี้และสถานะการส่งทั้งหมด?")) return false; c.works = c.works.filter(x => x.id !== S.workSel); delete c.sub[S.workSel]; delete (c.wsc || {})[S.workSel]; S.workSel = null; },

    printWorks() { printWorks(c); return false; },
    printWorksEx() { printWorks(c, null, true); return false; },
    printEx() { printWorks(c, c.works.find(x => x.id === S.workSel), true); return false; },
    exFull() { const w = c.works.find(x => x.id === S.workSel); const d = document.createElement("div"); d.className = "exfull";
      d.innerHTML = `<div class="in"><div class="row" style="justify-content:space-between"><h2 style="margin:0">ตัวอย่างผลงาน: ${esc(w.name)}</h2><button class="btn" data-x="1">✕ ปิด</button></div>${exHTML(w)}</div>`;
      const close = () => { d.remove(); document.removeEventListener("keydown", k, true); }, k = e => { if (e.key === "Escape") close(); };
      d.addEventListener("click", e => { if (e.target.closest("[data-x]")) close(); }); document.addEventListener("keydown", k, true); document.body.appendChild(d); return false; },
    addNb() { const nb = NB(c), k = { id: uid(), date: today(), title: `ครั้งที่ ${nb.checks.length + 1}` }; nb.checks.push(k); nb.checks.sort((x, y) => x.date.localeCompare(y.date)); S.nbSel = k.id; toast("เพิ่มวันตรวจสมุด " + thDate(k.date)); },
    nbAll() { const mk = NB(c).marks[S.nbSel] ||= {}; room.students.forEach(s => { if (!mk[s.id]) mk[s.id] = Object.fromEntries(NBK.map(([x]) => [x, 1])); }); },
    async nbClear() { if (!await ask("ล้างการติ๊กของการตรวจสมุดครั้งนี้?")) return false; delete NB(c).marks[S.nbSel]; },
    async delNb() { const nb = NB(c); if (!await ask("ลบวันตรวจสมุดครั้งนี้และการติ๊กทั้งหมด?")) return false; nb.checks = nb.checks.filter(x => x.id !== S.nbSel); delete nb.marks[S.nbSel]; S.nbSel = null; },
    csvNb() { const nb = NB(c), mx = nbMax(c); csv(fn(c, "ตรวจสมุด"), [["ที่", "ชื่อ-สกุล", ...nb.checks.map(k => `${thDate(k.date)} ${k.title} (${NBK.length})`), "ส่ง (ครั้ง)", "รวมติ๊ก", "%", `คะแนนสมุด (${mx})`],
      ...sortedStu(c).map(s => { const a = nbStat(c, s.id); return [s.no, fullName(s), ...nb.checks.map(k => { const m = (nb.marks[k.id] || {})[s.id] || {}; return m.s ? NBK.filter(([x]) => m[x]).length : "ไม่ส่ง"; }), `${a.sent}/${a.n}`, `${a.got}/${a.poss}`, a.pct == null ? "" : fmt(a.pct, 0), a.pct == null ? "" : fmt(a.pct / 100 * mx, 2)]; })]); return false; },
    allOk() { const sub = c.sub[S.workSel] ||= {}; room.students.forEach(s => { if (!sub[s.id]) sub[s.id] = "ok"; }); },
    cycle() { const sub = c.sub[S.workSel] ||= {}; const order = [undefined, "ok", "late", "no"]; const nx = order[(order.indexOf(sub[sid]) + 1) % 4]; if (nx) sub[sid] = nx; else delete sub[sid]; },
    addCourse() { const n = val("ncName"), rid = val("ncRoom"); if (!n) { toast("ใส่ชื่อวิชาก่อน"); return false; }
      if (roomCourses(rid).some(x => x.subject === n)) { toast("ห้องนี้มีวิชานี้แล้ว"); return false; }
      const tpl = S.courses.find(x => x.id === val("ncTpl"));
      const nc = newCourse(rid, n, tpl ? JSON.parse(JSON.stringify(tpl.cols)) : null); S.courses.push(nc); S.cur = nc.id; S.tab = "score";
      toast(`เพิ่มวิชา ${n} ให้ ${S.rooms.find(x => x.id === rid).name}`); },
    addRoom() { const n = val("nrName"); if (!n) { toast("ใส่ชื่อห้องก่อน"); return false; } if (S.rooms.some(x => x.name === n)) { toast("มีห้องนี้แล้ว"); return false; }
      const r = { id: uid(), name: n, students: [] }; S.rooms.push(r);
      const nc = newCourse(r.id, c.subject, JSON.parse(JSON.stringify(c.cols))); S.courses.push(nc); S.cur = nc.id; S.tab = "stu";
      toast(`เพิ่มห้อง ${n} (วิชา ${c.subject}) — วางรายชื่อได้เลย`); },
    addCol() { const n = val("ncolName"), m = +val("ncolMax"), g = val("ncolGrp"); if (!n || !(m > 0)) { toast("ใส่ชื่อช่องและคะแนนเต็ม"); return false; }
      const grp = colById(c, g), id = "c" + uid(), at = c.cols.indexOf(grp);
      c.cols.splice(at, 0, { id, name: n, max: m, kind: "in" }); grp.src.push(id); toast("เพิ่มช่องแล้ว — คะแนนเต็มรวมเปลี่ยนตาม"); },
    async delCol() { const id = tr.dataset.cid, x = colById(c, id); if (!await ask(`ลบช่อง "${x.name}" และคะแนนในช่องนี้ทั้งหมด?`)) return false;
      if (c.nb?.link === id) c.nb.link = null; c.cols = c.cols.filter(y => y.id !== id); c.cols.forEach(y => { if (y.src) y.src = y.src.filter(z => z !== id); });
      for (const s in c.scores) delete c.scores[s][id]; },
    async delCourse() { if (S.courses.length === 1) { toast("ต้องมีอย่างน้อย 1 วิชา"); return false; } if (!await ask(`ลบวิชา ${c.subject} ของ ${room.name} และคะแนน/เช็กชื่อทั้งหมด?`)) return false;
      S.courses = S.courses.filter(x => x.id !== c.id); S.cur = (roomCourses(room.id)[0] || S.courses[0]).id; },
    async delRoom() { if (S.rooms.length === 1) { toast("ต้องมีอย่างน้อย 1 ห้อง"); return false; } if (!await ask(`ลบห้อง ${room.name} รายชื่อ และทุกวิชาของห้องนี้?`)) return false;
      if (!await ask("ยืนยันอีกครั้ง: กู้คืนไม่ได้ถ้าไม่ได้สำรองไว้")) return false;
      S.rooms = S.rooms.filter(x => x.id !== room.id); S.courses = S.courses.filter(x => x.roomId !== room.id); S.cur = S.courses[0].id; },
    backup() { download(`SmartGrade_สำรอง_${today()}.json`, JSON.stringify(S), "application/json"); S.lastBackup = Date.now(); toast("ดาวน์โหลดไฟล์สำรองแล้ว"); },
    async reset() { if (!await ask("เริ่มใหม่ทั้งหมด? รายชื่อ คะแนน และการเช็กชื่อที่บันทึกในเครื่องนี้จะหายทั้งหมด แนะนำให้สำรองข้อมูลก่อน")) return false; if (!await ask("ยืนยันอีกครั้ง")) return false; S = defaults(); migrate(); },
    print() { window.print(); return false; },
    csvScore() {
      const head = ["ที่", "ชื่อ", "นามสกุล", ...c.cols.map(x => `${x.name} (${fmt(colMax(c, x), 2)})`), "เกรด"];
      const meta = [[S.settings.school], [`วิชา ${c.subject}  ระดับชั้น ${room.name}  ภาคเรียนที่ ${S.settings.term}  ครูผู้สอน ${S.settings.teacher}`], []];
      csv(fn(c, "คะแนน"), [...meta, head, ...sortedStu(c).map(s => [s.no, (LONGP[s.prefix] ?? s.prefix) + s.first, s.last, ...c.cols.map(x => cellOut(c, s.id, x)), gradeOf(c, s.id)])]); return false; },
    csvAtt() { const ds = Object.keys(c.att).sort(); csv(fn(c, "เวลาเรียน"), [["ที่","ชื่อ-สกุล", ...ds.map(thDate), "มา","สาย","ลา","ป่วย","ขาด","รวม","% เวลาเรียน"], ...sortedStu(c).map(s => { const a = attStat(c, s.id); return [s.no, fullName(s), ...ds.map(d => c.att[d][s.id] || ""), a.ม, a.ส, a.ล, a.ป, a.ข, a.tot, a.pct == null ? "" : fmt(a.pct)]; })]); return false; },
    csvWork() { csv(fn(c, "งาน"), [["ที่","ชื่อ-สกุล", ...c.works.flatMap(w => [`${w.name} (เต็ม ${fmt(w.max, 2)})`, "สถานะ"]), "ค้าง", "% ส่งงาน"], ...sortedStu(c).map(s => { const w = workStat(c, s.id); return [s.no, fullName(s), ...c.works.flatMap(x => { const p = wScore(c, x, s.id); return [p == null ? "" : fmt(p, 2), WST[(c.sub[x.id] || {})[s.id]] || ""]; }), w.no, w.pct == null ? "" : fmt(w.pct, 0)]; })]); return false; },
  }[a];
  if (!act) return;
  const res = act();
  if (res instanceof Promise) res.then(v => { if (v !== false) { save(); render(); } });
  else if (res !== false) { save(); render(); }
});
main.addEventListener("change", e => {
  const c = C(), t = e.target, tr = t.closest("tr");
  if (t.id === "attDate") { S.attDate = t.value || today(); save(); return render(); }
  if (t.id === "workSel") { S.workSel = t.value; save(); return render(); }
  if (t.dataset.w) { const w = c.works.find(x => x.id === S.workSel); if (!w) return; const f = t.dataset.w, v = t.value;
    if (f === "how") w.how = v.split(/\n/).map(x => x.trim()).filter(Boolean);
    else if (f === "rub") w.rub = parseRub(v);
    else if (f === "max") { if (!(+v > 0)) { toast("คะแนนเต็มต้องมากกว่า 0"); return render(); } w.max = +v; }
    else if (f === "col") { w.col = v || null; const x = colById(c, v); if (x) { w.max = +x.max; adoptScores(c, w); toast(`ใส่คะแนนงานนี้ลงช่อง "${x.name}" แล้ว (คะแนนเต็ม ${x.max})`); } }
    else w[f] = f === "name" ? (v.trim() || w.name) : v.trim();
    save(); render(); const d = main.querySelector("details.wedit"); if (d) d.open = true; return; }
  if (t.dataset.ws && tr?.dataset.sid) {
    const w = c.works.find(x => x.id === t.dataset.ws), sid = tr.dataset.sid, v = t.value.trim(), max = +w.max, row = (c.wsc ||= {})[w.id] ||= {};
    if (v === "") { delete row[sid]; t.classList.remove("bad"); }
    else if (isNaN(v) || +v < 0 || +v > max) { t.classList.add("bad"); toast(`คะแนนงานนี้ต้องอยู่ระหว่าง 0–${max}`); return; }
    else { row[sid] = +v; t.classList.remove("bad"); const sub = c.sub[w.id] ||= {}; if (!sub[sid] || sub[sid] === "no") sub[sid] = "ok"; }
    save(); updateWorkRow(c, tr);
    setTimeout(() => { const f = document.activeElement, fs = f?.dataset?.ws ? f.closest("tr")?.dataset.sid : null; render();
      if (fs) { const n = main.querySelector(`tr[data-sid="${fs}"] input[data-ws]`); if (n) { n.focus(); n.select(); } } }, 0);
    return; }
  if (t.id === "nbSel") { S.nbSel = t.value; save(); return render(); }
  if (t.id === "nbDate" || t.id === "nbTitle") { const nb = NB(c), k = nb.checks.find(x => x.id === S.nbSel); if (!k) return;
    if (t.id === "nbDate") { k.date = t.value || k.date; nb.checks.sort((x, y) => x.date.localeCompare(y.date)); } else k.title = t.value.trim() || k.title; save(); return render(); }
  if (t.id === "nbLink") { NB(c).link = t.value || null; save(); toast(t.value ? "ใส่คะแนนสมุดลงในตารางคะแนนแล้ว" : "เอาคะแนนสมุดออกจากตารางคะแนนแล้ว"); return render(); }
  if (t.id === "nbMax") { NB(c).max = +t.value || 0; save(); return render(); }
  if (t.id === "restore") {
    const f = t.files[0]; if (!f) return;
    f.text().then(async txt => { const d = JSON.parse(txt); if (!d.rooms || !d.courses || !d.settings) throw 0;
      if (!await ask(`นำเข้าไฟล์ ${f.name}? ข้อมูลปัจจุบันในเครื่องนี้จะถูกแทนที่`)) return; S = d; migrate(); save(); render(); toast("นำเข้าข้อมูลเรียบร้อย"); })
      .catch(() => toast("ไฟล์ไม่ถูกต้อง"));
    return;
  }
  if (t.dataset.f) { const s = R(c).students.find(x => x.id === tr.dataset.sid); s[t.dataset.f] = t.dataset.f === "no" ? (+t.value || t.value) : t.value.trim(); save(); return; }
  if (t.dataset.cid && tr?.dataset.sid) {
    const v = t.value.trim(), max = +t.dataset.max, row = c.scores[tr.dataset.sid] ||= {};
    if (v === "") { delete row[t.dataset.cid]; t.classList.remove("bad"); }
    else if (isNaN(v) || +v < 0 || +v > max) { t.classList.add("bad"); toast(`คะแนนช่องนี้ต้องอยู่ระหว่าง 0–${max}`); return; }
    else { row[t.dataset.cid] = +v; t.classList.remove("bad"); }
    save(); updateScoreRow(c, tr); return;
  }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.dataset.set === "thr" ? (+t.value || 0) : t.value; save(); return; }
  if (t.dataset.course) { c[t.dataset.course] = t.value.trim() || c[t.dataset.course]; save(); renderHeader(); return; }
  if (t.dataset.room) { R(c).name = t.value.trim() || R(c).name; save(); renderHeader(); return; }
  if (t.dataset.col) { const x = colById(c, tr.dataset.cid); x[t.dataset.col] = t.dataset.col === "max" ? (+t.value || 0) : t.value; save(); return render(); }
  if (t.dataset.crit) { S.settings.criteria[+tr.dataset.ci][+t.dataset.crit] = +t.value || 0; save(); return; }
});
main.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.matches("input.sc[data-cid], input.sc[data-ws]")) return;
  e.preventDefault();
  const td = e.target.closest("td"), idx = [...td.parentNode.children].indexOf(td);
  const next = td.parentNode.nextElementSibling?.children[idx]?.querySelector("input");
  e.target.dispatchEvent(new Event("change", { bubbles: true }));
  if (next) { next.focus(); next.select(); } else e.target.blur();
});
window.addEventListener("storage", () => { try { S = JSON.parse(localStorage.getItem(KEY)) || S; migrate(); render(); } catch (e) {} });
migrate(); save(); render();
